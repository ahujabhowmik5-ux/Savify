<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60" fill="none">
  <!-- Bill body -->
  <rect x="2" y="2" width="116" height="56" rx="4" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
  <!-- Inner border -->
  <rect x="8" y="8" width="104" height="44" rx="2" fill="none" stroke="#2E7D32" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
  <!-- Center circle -->
  <circle cx="60" cy="30" r="14" fill="#388E3C" stroke="#2E7D32" stroke-width="1.5"/>
  <!-- Dollar sign -->
  <text x="60" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#C8E6C9">$</text>
  <!-- Corner 100s -->
  <text x="14" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#2E7D32" opacity="0.7">100</text>
  <text x="106" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#2E7D32" opacity="0.7">100</text>
  <text x="14" y="51" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#2E7D32" opacity="0.7">100</text>
  <text x="106" y="51" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#2E7D32" opacity="0.7">100</text>
  <!-- Decorative lines -->
  <line x1="30" y1="28" x2="42" y2="28" stroke="#2E7D32" stroke-width="1" opacity="0.4"/>
  <line x1="30" y1="32" x2="42" y2="32" stroke="#2E7D32" stroke-width="1" opacity="0.4"/>
  <line x1="78" y1="28" x2="90" y2="28" stroke="#2E7D32" stroke-width="1" opacity="0.4"/>
  <line x1="78" y1="32" x2="90" y2="32" stroke="#2E7D32" stroke-width="1" opacity="0.4"/>
</svg>
